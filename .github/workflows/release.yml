name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new v* release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            paths: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            paths: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - label: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Test web and core
        run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    name: Publish checksummed release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Prepare checksums and immutable manifest
        run: node scripts/release-manifest.mjs release-assets
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
      - name: Upload complete draft release
        id: draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Local Data Finder ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: true
          files: |
            release-assets/**/*
          fail_on_unmatched_files: true
      - name: Verify assets, publish, and require immutability
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId)) {
              throw new Error("Draft release did not return a valid release ID");
            }

            const { data: draft } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            const names = draft.assets.map((asset) => asset.name);
            const required = ["SHA256SUMS", "latest.json"];
            const extensions = [".AppImage", ".deb", ".dmg", ".dmg", ".exe", ".msi"];
            const missing = required.filter((name) => !names.includes(name));
            for (const extension of new Set(extensions)) {
              const expected = extensions.filter((item) => item === extension).length;
              const actual = names.filter((name) => name.endsWith(extension)).length;
              if (actual !== expected) missing.push(`${extension} (${actual}/${expected})`);
            }
            if (!draft.draft || names.length !== 8 || missing.length) {
              throw new Error(`Release asset validation failed: ${missing.join(", ") || `${names.length}/8 assets`}`);
            }

            const { data: published } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
              make_latest: "true",
            });
            if (published.draft || !published.immutable) {
              throw new Error("GitHub did not publish the release as immutable");
            }
            core.info(`Published immutable release ${published.tag_name} with ${names.length} assets`);
