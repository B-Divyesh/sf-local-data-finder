[package]
name = "local-data-finder"
version = "0.1.9"
description = "Private, source-grounded search across local archives"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "local_data_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.21"
